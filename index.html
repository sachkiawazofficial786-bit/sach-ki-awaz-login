<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سچ کی آواز — Login</title>
<style>
:root{--ink:#10233f;--gold:#c9a227;--bg:#f4f7fb;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef3f9,#fff);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #e5eaf1;border-radius:24px;box-shadow:0 18px 55px #10233f18;padding:30px}.brand{text-align:center;margin-bottom:24px}.logo{width:82px;height:82px;margin:auto;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;border:4px solid var(--gold);font-weight:800;font-size:25px}.brand h1{margin:13px 0 4px;font-size:29px}.brand p{margin:0;color:var(--muted);font-size:14px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f0f3f7;border-radius:12px;padding:4px;margin-bottom:22px}.tabs button{border:0;background:transparent;padding:12px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}.tabs button.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px #10233f12}label{display:block;font-size:14px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d8dee8;border-radius:11px;font-size:15px;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c9a22722}.password{position:relative}.password input{padding-right:48px}.eye{position:absolute;right:10px;top:8px;border:0;background:transparent;padding:9px;cursor:pointer;color:var(--muted)}.primary{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-size:16px;font-weight:800;cursor:pointer}.link{border:0;background:none;color:#9a7610;font-weight:700;cursor:pointer;padding:0}.forgot{text-align:right;margin-top:12px}.message{display:none;margin-top:15px;padding:11px 13px;border-radius:10px;background:#f1f5f9;font-size:13px;line-height:1.5}.message.show{display:block}.success{background:#ecfdf3;color:#166534}.error{background:#fef2f2;color:#991b1b}.small{text-align:center;margin-top:18px;color:var(--muted);font-size:12px}#signupFields{display:none}.userbox{display:none;text-align:center}.userbox h2{margin:10px 0 4px}.userbox p{color:var(--muted)}.logout{margin-top:15px;background:#fff;color:var(--ink);border:1px solid #d8dee8}
.customize{margin-top:22px;border-top:1px solid #e5eaf1;padding-top:18px}.customize-toggle{width:100%;padding:11px;border:1px solid #d8dee8;background:#fff;border-radius:11px;color:var(--ink);font-weight:700;cursor:pointer}.customize-panel{display:none;margin-top:12px;padding:14px;background:#f8fafc;border-radius:14px}.customize-panel.open{display:block}.customize-panel label{margin:10px 0 6px}.customize-panel input[type=text],.customize-panel input[type=color]{width:100%;height:42px}.customize-panel input[type=color]{padding:3px}.customize-panel input[type=file]{width:100%;font-size:12px}.customize-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.customize-actions button{padding:10px;border-radius:10px;border:1px solid #d8dee8;background:#fff;font-weight:700;cursor:pointer}.customize-actions .save{background:var(--ink);color:#fff}.customize-note{font-size:11px;color:var(--muted);line-height:1.4;margin:10px 0 0} .logo img{width:100%;height:100%;object-fit:cover;border-radius:50%} @media(max-width:480px){.card{padding:22px}.customize-actions{grid-template-columns:1fr}}
</style></head>
<body><main class="card">
<section class="brand"><div class="logo">سچ</div><h1>سچ کی آواز</h1><p>Daily Newspaper • Sach Ki Awaz</p></section>
<section id="authBox"><div class="tabs"><button id="loginTab" class="active">Login</button><button id="signupTab">Sign Up</button></div>
<form id="authForm"><div id="signupFields"><label>Full Name</label><input id="name" type="text" autocomplete="name" placeholder="Your full name"></div>
<label>Email</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com" required>
<label>Password</label><div class="password"><input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required><button class="eye" type="button" id="togglePassword">◉</button></div>
<div id="confirmWrap" style="display:none"><label>Confirm Password</label><div class="password"><input id="confirm" type="password" autocomplete="new-password" placeholder="Re-enter password"><button class="eye" type="button" id="toggleConfirm">◉</button></div></div>
<div class="forgot"><button type="button" class="link" id="forgot">Forgot password?</button></div><button class="primary" id="submitBtn" type="submit">Login</button><div id="message" class="message"></div></form></section>
<section id="userBox" class="userbox"><div class="logo">سچ</div><h2>Welcome</h2><p id="userEmail"></p><button class="primary logout" id="logout">Logout</button></section>
<div class="customize"><button class="customize-toggle" id="customizeToggle">⚙ Customize Design</button><div class="customize-panel" id="customizePanel"><label>Logo image</label><input id="logoFile" type="file" accept="image/*"><label>Title</label><input id="brandTitle" type="text" value="سچ کی آواز"><label>Subtitle</label><input id="brandSubtitle" type="text" value="Daily Newspaper • Sach Ki Awaz"><label>Primary color</label><input id="primaryColor" type="color" value="#10233f"><label>Accent color</label><input id="accentColor" type="color" value="#c9a227"><label>Page background</label><input id="pageColor" type="color" value="#f4f7fb"><div class="customize-actions"><button id="resetDesign" type="button">Reset</button><button id="saveDesign" class="save" type="button">Save Design</button></div><p class="customize-note">Design settings are saved in this browser. Firebase login security remains separate.</p></div></div><div class="small">Secure authentication powered by Firebase</div></main>
<script type="module">
const DESIGN_KEY="sachKiAwazLoginDesignV1";
const designDefault={title:"سچ کی آواز",subtitle:"Daily Newspaper • Sach Ki Awaz",primary:"#10233f",accent:"#c9a227",bg:"#f4f7fb",logo:""};
function applyDesign(d){document.title=d.title+" — Login";document.querySelector(".brand h1").textContent=d.title;document.querySelector(".brand p").textContent=d.subtitle;document.documentElement.style.setProperty("--ink",d.primary);document.documentElement.style.setProperty("--gold",d.accent);document.documentElement.style.setProperty("--bg",d.bg);document.body.style.background=d.bg;document.querySelectorAll(".logo").forEach(el=>{el.innerHTML=d.logo?'<img src="'+d.logo+'" alt="Logo">':"سچ"});$("brandTitle").value=d.title;$("brandSubtitle").value=d.subtitle;$("primaryColor").value=d.primary;$("accentColor").value=d.accent;$("pageColor").value=d.bg}
function loadDesign(){try{return JSON.parse(localStorage.getItem(DESIGN_KEY))||designDefault}catch{return designDefault}}
function readDesign(){return{title:$("brandTitle").value.trim()||designDefault.title,subtitle:$("brandSubtitle").value.trim(),primary:$("primaryColor").value,accent:$("accentColor").value,bg:$("pageColor").value,logo:window.__logoData||loadDesign().logo}}

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail,signOut,onAuthStateChanged,updateProfile}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyD0CmQS7agqnG15ErAtEToD627KeDij20Q",authDomain:"sachkiawaz786.firebaseapp.com",projectId:"sachkiawaz786",storageBucket:"sachkiawaz786.firebasestorage.app",messagingSenderId:"56855864275",appId:"1:56855864275:web:2f05336386790eb16c4526"};
const auth=getAuth(initializeApp(firebaseConfig));const $=id=>document.getElementById(id);let mode="login";
function msg(t,type=""){const m=$("message");m.textContent=t;m.className="message"+(t?" show ":" ")+(type||"")}
function setMode(n){mode=n;let s=n==="signup";$("loginTab").classList.toggle("active",!s);$("signupTab").classList.toggle("active",s);$("signupFields").style.display=s?"block":"none";$("confirmWrap").style.display=s?"block":"none";$("forgot").style.display=s?"none":"inline";$("submitBtn").textContent=s?"Create Account":"Login";msg("")}
function friendly(e){return({"auth/email-already-in-use":"This email is already registered.","auth/invalid-email":"Please enter a valid email address.","auth/invalid-credential":"Email or password is incorrect.","auth/weak-password":"Please choose a stronger password.","auth/user-not-found":"No account was found with this email."})[e.code]||e.message||"Something went wrong."}
$("loginTab").onclick=()=>setMode("login");$("signupTab").onclick=()=>setMode("signup");
function toggle(id){let x=$(id);x.type=x.type==="password"?"text":"password"}$("togglePassword").onclick=()=>toggle("password");$("toggleConfirm").onclick=()=>toggle("confirm");
$("authForm").onsubmit=async e=>{e.preventDefault();msg("");let email=$("email").value.trim(),pass=$("password").value;if(mode==="signup"){let name=$("name").value.trim(),confirm=$("confirm").value;if(!name)return msg("Please enter your full name.","error");if(pass!==confirm)return msg("Passwords do not match.","error");try{let c=await createUserWithEmailAndPassword(auth,email,pass);await updateProfile(c.user,{displayName:name});msg("Account created successfully.","success")}catch(err){msg(friendly(err),"error")}}else{try{await signInWithEmailAndPassword(auth,email,pass)}catch(err){msg(friendly(err),"error")}}};
$("forgot").onclick=async()=>{let email=$("email").value.trim();if(!email)return msg("Enter your email first.","error");try{await sendPasswordResetEmail(auth,email);msg("Password reset email sent. Check your inbox.","success")}catch(err){msg(friendly(err),"error")}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(u){$("authBox").style.display="none";$("userBox").style.display="block";$("userEmail").textContent=u.displayName+" • "+u.email}else{$("authBox").style.display="block";$("userBox").style.display="none"}});
$("customizeToggle").onclick=()=>$("customizePanel").classList.toggle("open");
$("logoFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{window.__logoData=reader.result;applyDesign(readDesign())};reader.readAsDataURL(f)};
["brandTitle","brandSubtitle","primaryColor","accentColor","pageColor"].forEach(id=>$(id).oninput=()=>applyDesign(readDesign()));
$("saveDesign").onclick=()=>{const d=readDesign();localStorage.setItem(DESIGN_KEY,JSON.stringify(d));applyDesign(d);msg("Design saved on this browser.","success")};
$("resetDesign").onclick=()=>{localStorage.removeItem(DESIGN_KEY);window.__logoData="";applyDesign(designDefault);msg("Design reset.","success")};
applyDesign(loadDesign());
</script></body></html>
